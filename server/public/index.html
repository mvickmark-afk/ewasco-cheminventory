<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EWASCO Laboratory Information Management System</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#06111d;--panel:#0c1a29;--panel2:#102235;--line:#20384f;--text:#eaf3fa;--muted:#91a8bb;--accent:#42d392;--warn:#e7bd64;--danger:#ff6575;--shadow:0 12px 36px rgba(0,0,0,.24)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.wrap{max-width:1500px;margin:auto;padding:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.login{min-height:100vh;display:grid;place-items:center}.login .card{width:min(440px,calc(100% - 28px))}
h1,h2,h3{margin:0 0 10px}.muted{color:var(--muted)}.error{color:var(--danger);min-height:20px}.success{color:var(--accent)}label{display:grid;gap:6px;margin:10px 0}.input,select,textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}.input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}textarea{min-height:100px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:9px}.btn:hover{border-color:#3b627e}.primary{background:var(--accent);color:#051a11;border-color:var(--accent);font-weight:700}.danger{background:var(--danger);color:#fff;border-color:var(--danger)}.ghost{background:transparent}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.spacer{flex:1}.grid{display:grid;grid-template-columns:240px 1fr;gap:16px}.nav{display:grid;gap:6px;align-content:start;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}.nav button{text-align:left}.nav .section{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:8px 4px 2px}.nav button.active{border-color:var(--accent);color:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.table th{color:var(--muted);font-size:12px}.table tr.clickable{cursor:pointer}.table tr.clickable:hover{background:#0f2434}
.badge{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--muted)}.badge.good{color:var(--accent);border-color:#21664f}.badge.bad{color:var(--danger);border-color:#6b2d39}.badge.warn{color:var(--warn);border-color:#66521f}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}.kpi .n{font-size:24px;font-weight:800}.kpi .l{font-size:11px;color:var(--muted);margin-top:4px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.setting-item{padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-width:0}.setting-label{font-size:12px;color:var(--muted);margin-bottom:6px}.setting-value{font-weight:600;overflow-wrap:anywhere}.span2{grid-column:span 2}.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.section-card{margin-top:14px}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(620px,100%);max-height:90vh;overflow:auto}.checklist{display:grid;gap:7px;max-height:260px;overflow:auto;border:1px solid var(--line);padding:10px;border-radius:10px;background:var(--panel2)}.check{display:flex;gap:8px;align-items:flex-start}.check input{margin-top:3px}
.security-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.note{font-size:12px;color:var(--muted);line-height:1.45}.warning{background:#2a220e;border:1px solid #66531f;color:#efd48e;padding:10px;border-radius:9px;font-size:12px}
@media(max-width:1050px){.grid{grid-template-columns:1fr}.nav{position:static;max-height:none;grid-template-columns:repeat(3,minmax(0,1fr))}.nav .section{grid-column:1/-1}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.wrap{padding:10px}.nav{grid-template-columns:1fr 1fr}.form-grid,.settings-grid,.split,.security-grid{grid-template-columns:1fr}.span2{grid-column:span 1}.kpis{grid-template-columns:1fr 1fr}.table th,.table td{padding:8px 7px}}
</style>
</head>
<body>
<section id="login" class="login">
  <form id="loginForm" class="card">
    <h1>EWASCO <span style="color:var(--accent)">LIMS</span></h1>
    <p class="muted">Secure laboratory information management system</p>
    <label>Username<input id="username" class="input" autocomplete="username" required></label>
    <label>Password<input id="password" class="input" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <p id="loginError" class="error"></p>
  </form>
</section>

<section id="app" class="wrap hidden">
  <header class="bar">
    <div><h1 style="margin:0">EWASCO LIMS</h1><span id="identity" class="muted"></span></div>
    <span class="spacer"></span>
    <span class="badge">Server-enforced security</span>
    <button id="logout" class="btn">Sign out</button>
  </header>
  <div class="grid">
    <nav id="nav" class="card nav"></nav>
    <main class="card">
      <div class="bar"><div><h2 id="title"></h2><div id="subtitle" class="muted"></div></div><span class="spacer"></span><button id="refresh" class="btn">Refresh</button></div>
      <div id="content"></div>
    </main>
  </div>
</section>

<script src="/validators.js?v=20261022-2"></script>
<script src="/api-client.js?v=20261022-2"></script>
<script src="/app.js?v=20261022-2"></script>
</body>
</html>
