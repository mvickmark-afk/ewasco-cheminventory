<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChemInventory — Laboratory Chemical Management</title>
<style>
:root{--bg:#f5f7f8;--surface:#fff;--surface2:#f0f4f3;--line:#dce5e2;--text:#14211e;--muted:#65736f;--accent:#0fa968;--accent2:#087d4b;--danger:#c9364b;--warning:#a56a00;--shadow:0 8px 30px rgba(20,33,30,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}.brand{display:flex;gap:10px;align-items:center;margin-bottom:8px}.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:white;font-weight:800;font-size:20px}.muted{color:var(--muted)}label{display:grid;gap:6px;margin:12px 0;font-weight:600}.input,.select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;color:var(--text);outline:none}.input:focus,.select:focus{border-color:var(--accent)}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 13px;border-radius:9px}.btn:hover{border-color:#a9bdb7}.primary{background:var(--accent);border-color:var(--accent);color:white}.primary:hover{background:var(--accent2)}.danger{background:#fff0f2;border-color:#f3c5cc;color:var(--danger)}.shell{min-height:100vh}.topbar{height:68px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:16px;position:sticky;top:0;z-index:10}.topbar .spacer{flex:1}.identity{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 68px)}.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px}.nav-section{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 7px}.nav-btn{width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:9px;color:var(--text);margin-bottom:3px}.nav-btn:hover,.nav-btn.active{background:#eaf7f1;color:var(--accent2);font-weight:700}.main{padding:24px;max-width:1500px;width:100%;margin:auto}.page-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}.page-head .spacer{flex:1}.page-head h1{font-size:25px;margin:0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow)}.stat .value{font-size:26px;font-weight:750;margin:7px 0}.stat .label{font-size:12px;color:var(--muted)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:var(--shadow)}.panel h2{font-size:17px;margin:0 0 14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar .grow{flex:1;min-width:180px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:middle}.table th{font-size:12px;color:var(--muted);font-weight:650}.badge{display:inline-flex;align-items:center;border-radius:99px;padding:4px 8px;font-size:11px;background:var(--surface2);color:var(--muted)}.ok{background:#e9f8f0;color:#087d4b}.warn{background:#fff5df;color:var(--warning)}.bad{background:#fff0f2;color:var(--danger)}.empty{padding:30px;text-align:center;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.error{color:var(--danger);min-height:20px}.notice{padding:11px 13px;border-radius:9px;background:#fff5df;color:#6e4a00;margin-bottom:14px}.mobile-menu{display:none}.json{min-height:230px;resize:vertical;font-family:ui-monospace,monospace}.record-actions{display:flex;gap:5px;white-space:nowrap}
@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:68px;bottom:0;width:235px;z-index:9;transform:translateX(-105%);transition:.2s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.mobile-menu{display:block}.main{padding:16px}}
@media(max-width:600px){.cards{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.topbar{padding:0 12px}.identity{display:none}.page-head{align-items:flex-start}.page-head h1{font-size:21px}}
</style>
</head>
<body>
<section id="login" class="login">
<form id="loginForm" class="login-card">
<div class="brand"><div class="logo">C</div><div><strong>ChemInventory</strong><div class="muted">Laboratory Chemical Management</div></div></div>
<p class="muted">Secure organisation sign in.</p>
<label>Username<input id="username" class="input" autocomplete="username" required></label>
<label>Password<input id="password" class="input" type="password" autocomplete="current-password" required></label>
<button class="btn primary" style="width:100%;margin-top:8px" type="submit">Sign in</button>
<p id="loginError" class="error"></p>
</form>
</section>

<section id="app" class="shell hidden">
<header class="topbar"><button id="menu" class="btn mobile-menu">Menu</button><div class="brand" style="margin:0"><div class="logo">C</div><strong>ChemInventory</strong></div><span class="spacer"></span><span id="identity" class="identity"></span><button id="backup" class="btn">Backup</button><button id="logout" class="btn">Sign out</button></header>
<div class="layout">
<aside id="sidebar" class="sidebar">
<div class="nav-section">Workspace</div>
<button class="nav-btn active" data-page="dashboard">Dashboard</button>
<button class="nav-btn" data-page="stock">Stock</button>
<button class="nav-btn" data-page="transactions">Transactions</button>
<div class="nav-section">Laboratory</div>
<button class="nav-btn" data-page="records:chemicals">Chemicals</button>
<button class="nav-btn" data-page="records:reagents">Reagent Preparation</button>
<button class="nav-btn" data-page="records:equipment">Equipment</button>
<button class="nav-btn" data-page="records:calibrations">Calibrations</button>
<button class="nav-btn" data-page="records:sds">SDS / MSDS</button>
<button class="nav-btn" data-page="records:waste">Waste</button>
<button class="nav-btn" data-page="records:water">Water Treatment</button>
<div class="nav-section">Supply & Administration</div>
<button class="nav-btn" data-page="records:suppliers">Suppliers</button>
<button class="nav-btn" data-page="records:procurement">Procurement</button>
<button class="nav-btn" data-page="records:consumption">Consumption</button>
<button class="nav-btn" data-page="records:settings">Settings</button>
</aside>
<main id="main" class="main"></main>
</div>
</section>

<script src="/api-client.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={user:null,page:'dashboard',chemicals:[],stock:[],transactions:[],selectedChemical:null};
const canMutate=()=>['Administrator','Laboratory Manager','Storekeeper'].includes(state.user?.role);
const labels={chemicals:'Chemicals',reagents:'Reagent Preparation',equipment:'Equipment',calibrations:'Calibrations',sds:'SDS / MSDS',waste:'Waste',water:'Water Treatment',suppliers:'Suppliers',procurement:'Procurement',consumption:'Consumption',settings:'Settings'};
function setError(id,e){const el=$(id);if(el)el.textContent=e.message||String(e)}
async function boot(){try{const x=await EWASCO_API.me();state.user=x.user;showApp();await renderPage()}catch{}}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('identity').textContent=`${state.user.name} · ${state.user.role}`}
function setActive(){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page))}
function navigate(page){state.page=page;setActive();$('sidebar').classList.remove('open');renderPage()}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
$('menu').onclick=()=>$('sidebar').classList.toggle('open');

async function renderPage(){setActive();const m=$('main');m.innerHTML='<div class="panel">Loading…</div>';try{
 if(state.page==='dashboard')return dashboard();
 if(state.page==='stock')return stockPage();
 if(state.page==='transactions')return transactionsPage();
 if(state.page.startsWith('records:'))return recordsPage(state.page.split(':')[1]);
}catch(e){m.innerHTML=`<div class="panel"><p class="error">${esc(e.message)}</p></div>`}}

async function loadChemicals(){state.chemicals=await EWASCO_API.list('chemicals');return state.chemicals}
function chemicalName(id){const c=state.chemicals.find(x=>x.id===id);return c?.name||id}
function pageHead(title,sub,actions=''){return `<div class="page-head"><div><h1>${esc(title)}</h1><div class="muted">${esc(sub)}</div></div><span class="spacer"></span>${actions}</div>`}

async function dashboard(){await loadChemicals();let batches=0,units=0,expiring=0;
 for(const c of state.chemicals){try{const rows=await EWASCO_API.inventoryStock(c.id);batches+=rows.length;units+=rows.reduce((s,x)=>s+Number(x.availableQuantity||0),0);expiring+=rows.filter(x=>x.expiryDate&&((new Date(x.expiryDate)-new Date())/86400000)<=30&&Number(x.availableQuantity)>0).length}catch{}}
 $('main').innerHTML=pageHead('Dashboard','Inventory control and laboratory operations')+`
 <div class="cards"><div class="stat"><div class="label">Chemicals</div><div class="value">${state.chemicals.length}</div><div class="label">Chemical master records</div></div>
 <div class="stat"><div class="label">Active batches</div><div class="value">${batches}</div><div class="label">Physical lots tracked</div></div>
 <div class="stat"><div class="label">Expiring ≤30 days</div><div class="value">${expiring}</div><div class="label">Batches requiring attention</div></div>
 <div class="stat"><div class="label">Available stock</div><div class="value">${units.toFixed(2)}</div><div class="label">Across supported units</div></div></div>
 <div class="panel"><h2>Inventory workflow</h2><div class="toolbar">
 <button class="btn primary" onclick="navigate('stock')">View stock</button>
 ${canMutate()?'<button class="btn" onclick="openInventoryForm(\'receive\')">Receive stock</button><button class="btn" onclick="openInventoryForm(\'issue\')">Issue / consume</button>':''}
 <button class="btn" onclick="navigate('transactions')">Transaction history</button></div>
 <p class="muted">Authoritative stock is calculated from batch-level inventory transactions. The chemical master is not the stock ledger.</p></div>
 <div class="panel"><h2>System status</h2><div class="table-wrap"><table class="table"><tr><td>Organisation</td><td>${esc(state.user.name)}'s organisation</td></tr><tr><td>Role</td><td><span class="badge ok">${esc(state.user.role)}</span></td></tr><tr><td>Inventory engine</td><td><span class="badge ok">Transaction-based</span></td></tr><tr><td>FIFO issuing</td><td><span class="badge ok">Enabled</span></td></tr><tr><td>Expiry exclusion</td><td><span class="badge ok">Enabled</span></td></tr></table></div></div>`}

async function stockPage(){await loadChemicals();let all=[];for(const c of state.chemicals){try{const rows=await EWASCO_API.inventoryStock(c.id);all.push(...rows.map(r=>({...r,chemicalName:c.name})))}catch{}}
$('main').innerHTML=pageHead('Stock','Batch-level stock, location and expiry',canMutate()?'<button class="btn primary" onclick="openInventoryForm(\'receive\')">Receive stock</button>':'')+`
<div class="panel"><div class="toolbar"><input id="stockSearch" class="input grow" placeholder="Search chemical, lot or location…"><select id="stockFilter" class="select" style="max-width:170px"><option value="">All stock</option><option value="expiry">Expiring ≤30 days</option><option value="low">Zero / depleted</option></select></div><div id="stockTable"></div></div>`;
function draw(){const q=($('stockSearch').value||'').toLowerCase(),f=$('stockFilter').value;let rows=all.filter(r=>JSON.stringify(r).toLowerCase().includes(q));if(f==='expiry')rows=rows.filter(r=>r.expiryDate&&((new Date(r.expiryDate)-new Date())/86400000)<=30&&Number(r.availableQuantity)>0);if(f==='low')rows=rows.filter(r=>Number(r.availableQuantity)<=0);
 $('stockTable').innerHTML=rows.length?'<div class="table-wrap"><table class="table"><thead><tr><th>Chemical</th><th>Lot</th><th>Available</th><th>Location</th><th>Expiry</th><th>Status</th><th></th></tr></thead><tbody>'+rows.map(r=>{const days=r.expiryDate?Math.ceil((new Date(r.expiryDate)-new Date())/86400000):null;const status=Number(r.availableQuantity)<=0?'<span class="badge bad">Depleted</span>':days!==null&&days<=30?'<span class="badge warn">Expiring</span>':'<span class="badge ok">Available</span>';return `<tr><td><strong>${esc(r.chemicalName)}</strong><div class="muted">${esc(r.chemicalId)}</div></td><td>${esc(r.lotNumber)}</td><td>${Number(r.availableQuantity).toFixed(3)} ${esc(r.unit)}</td><td>${esc(r.location||'—')}</td><td>${esc(r.expiryDate||'—')}</td><td>${status}</td><td><button class="btn" onclick="showBatchTransactions('${esc(r.chemicalId)}')">History</button></td></tr>`}).join('')+'</tbody></table></div>':'<div class="empty">No stock records match the filter.</div>'}
draw();$('stockSearch').oninput=draw;$('stockFilter').onchange=draw}

async function transactionsPage(chemicalId=state.selectedChemical){await loadChemicals();if(!chemicalId){$('main').innerHTML=pageHead('Transactions','Select a chemical to inspect its complete ledger')+`<div class="panel"><label>Chemical<select id="txChemical" class="select"><option value="">Select…</option>${state.chemicals.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} — ${esc(c.id)}</option>`).join('')}</select></label><div id="txResult"></div></div>`;$('txChemical').onchange=()=>{state.selectedChemical=$('txChemical').value;transactionsPage(state.selectedChemical)};return}
const rows=await EWASCO_API.inventoryTransactions(chemicalId);$('main').innerHTML=pageHead('Transactions',chemicalName(chemicalId),'<button class="btn" onclick="navigate(\'transactions\')">Change chemical</button>')+`<div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Lot</th><th>Quantity</th><th>Reason</th><th>Reference</th><th>Actor</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${esc(new Date(r.createdAt).toLocaleString())}</td><td><span class="badge">${esc(r.transactionType)}</span></td><td>${esc(r.lotNumber||r.batchId||'—')}</td><td>${Number(r.quantity).toFixed(3)} ${esc(r.unit)}</td><td>${esc(r.reason||'—')}</td><td>${esc(r.reference||'—')}</td><td>${esc(r.actorId||'—')}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No transactions.</td></tr>'}</tbody></table></div></div>`}
function showBatchTransactions(id){state.selectedChemical=id;navigate('transactions')}
 
function openInventoryForm(type){const titles={receive:'Receive Stock',issue:'Issue / Consume',return:'Return Stock',adjust:'Adjust Stock',dispose:'Dispose Stock',transfer:'Transfer Batch'};loadChemicals().then(()=>{$('main').innerHTML=pageHead(titles[type],'Create a traceable inventory transaction')+`<div class="panel"><form id="invForm"><div class="form-grid"><label>Chemical<select id="fChemical" class="select" required><option value="">Select…</option>${state.chemicals.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} — ${esc(c.id)}</option>`).join('')}</select></label><label id="batchWrap" class="hidden">Batch<select id="fBatch" class="select"></select></label><label>Quantity<input id="fQty" class="input" type="number" min="0.000001" step="any" required></label><label>Unit<select id="fUnit" class="select"><option>g</option><option>kg</option><option>mg</option><option>mL</option><option>L</option><option>pcs</option></select></label><label id="lotWrap">Lot number<input id="fLot" class="input"></label><label id="expiryWrap">Expiry date<input id="fExpiry" class="input" type="date"></label><label id="locationWrap">Location<input id="fLocation" class="input"></label><label id="toLocationWrap" class="hidden">To location<input id="fToLocation" class="input"></label><label id="directionWrap" class="hidden">Direction<select id="fDirection" class="select"><option>INCREASE</option><option>DECREASE</option></select></label><label style="grid-column:1/-1">Reason<input id="fReason" class="input" required></label><label style="grid-column:1/-1">Reference<input id="fReference" class="input"></label></div><div class="form-actions"><button type="button" class="btn" onclick="navigate('stock')">Cancel</button><button class="btn primary">Save transaction</button></div><p id="formError" class="error"></p></form></div>`;
const needsBatch=['issue','return','adjust','dispose','transfer'].includes(type);$('batchWrap').classList.toggle('hidden',!needsBatch);$('lotWrap').classList.toggle('hidden',type!=='receive');$('expiryWrap').classList.toggle('hidden',type!=='receive');$('locationWrap').classList.toggle('hidden',type!=='receive');$('toLocationWrap').classList.toggle('hidden',type!=='transfer');$('directionWrap').classList.toggle('hidden',type!=='adjust');
$('fChemical').onchange=async()=>{if(!needsBatch)return;const rows=await EWASCO_API.inventoryStock($('fChemical').value);$('fBatch').innerHTML=rows.filter(x=>Number(x.availableQuantity)>0).map(x=>`<option value="${esc(x.batchId)}" data-unit="${esc(x.unit)}">${esc(x.lotNumber)} — ${Number(x.availableQuantity).toFixed(3)} ${esc(x.unit)} — ${esc(x.location||'—')}</option>`).join('')};
$('invForm').onsubmit=async e=>{e.preventDefault();const chemicalId=$('fChemical').value,qty=Number($('fQty').value),unit=$('fUnit').value,reason=$('fReason').value.trim(),reference=$('fReference').value.trim();try{let result;if(type==='receive')result=await EWASCO_API.inventoryReceive({chemicalId,lotNumber:$('fLot').value.trim(),quantity:qty,unit,expiryDate:$('fExpiry').value||undefined,location:$('fLocation').value.trim()||undefined,reason,reference});else{const batchId=$('fBatch').value;if(!batchId)throw Error('Select a batch');const base={chemicalId,batchId,quantity:qty,unit,reason,reference};if(type==='issue')result=await EWASCO_API.inventoryIssue({...base});if(type==='return')result=await EWASCO_API.inventoryReturn({...base});if(type==='adjust')result=await EWASCO_API.inventoryAdjust({...base,direction:$('fDirection').value});if(type==='dispose')result=await EWASCO_API.inventoryDispose(base);if(type==='transfer')result=await EWASCO_API.inventoryTransfer({...base,toLocation:$('fToLocation').value.trim()})}alert('Transaction recorded successfully.');navigate('stock')}catch(e){setError('formError',e)}};
})}
 
async function recordsPage(entity){let records=await EWASCO_API.list(entity);const title=labels[entity]||entity;$('main').innerHTML=pageHead(title,'Organisation records',canMutate()?'<button class="btn primary" onclick="recordForm(\''+entity+'\')">New record</button>':'')+`<div class="panel"><div class="toolbar"><input id="recordSearch" class="input grow" placeholder="Search ${esc(title.toLowerCase())}…"></div><div id="recordTable"></div></div>`;
function draw(){const q=($('recordSearch').value||'').toLowerCase(),rows=records.filter(r=>JSON.stringify(r).toLowerCase().includes(q));if(!rows.length){$('recordTable').innerHTML='<div class="empty">No records found.</div>';return}const keys=[...new Set(rows.flatMap(r=>Object.keys(r).filter(k=>!k.startsWith('_'))))].slice(0,7);$('recordTable').innerHTML='<div class="table-wrap"><table class="table"><thead><tr>'+keys.map(k=>'<th>'+esc(k)+'</th>').join('')+(canMutate()?'<th></th>':'')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+keys.map(k=>'<td>'+esc(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])+'</td>').join('')+(canMutate()?'<td class="record-actions"><button class="btn" onclick="recordForm(\''+esc(entity)+'\',\''+esc(r.id)+'\')">Edit</button><button class="btn danger" onclick="deleteRecord(\''+esc(entity)+'\',\''+esc(r.id)+'\')">Delete</button></td>':'')+'</tr>').join('')+'</tbody></table></div>'}
draw();$('recordSearch').oninput=draw;window._records=records}
async function recordForm(entity,id){const records=window._records||[],record=id?records.find(x=>x.id===id):{id:`${entity.toUpperCase()}-${crypto.randomUUID().slice(0,8)}`};$('main').innerHTML=pageHead(id?'Edit '+labels[entity]:'New '+labels[entity])+`<div class="panel"><label>Record JSON<textarea id="recordJson" class="input json">${esc(JSON.stringify(record,null,2))}</textarea></label><div class="form-actions"><button class="btn" onclick="navigate('records:${esc(entity)}')">Cancel</button><button id="recordSave" class="btn primary">Save</button></div><p id="recordError" class="error"></p></div>`;$('recordSave').onclick=async()=>{try{const next=JSON.parse($('recordJson').value);const result=id?await EWASCO_API.update(entity,id,next,next._version||0):await EWASCO_API.create(entity,next);await recordsPage(entity)}catch(e){setError('recordError',e)}}
}
async function deleteRecord(entity,id){if(!confirm('Delete this record?'))return;try{await EWASCO_API.remove(entity,id);await recordsPage(entity)}catch(e){alert(e.message)}}

$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{const x=await EWASCO_API.login($('username').value,$('password').value);state.user=x.user;showApp();await renderPage()}catch(e){setError('loginError',e)}};
$('logout').onclick=async()=>{try{await EWASCO_API.logout()}finally{location.reload()}};
$('backup').onclick=async()=>{try{const x=await EWASCO_API.backup();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));a.download=`laboratory-inventory-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}catch(e){alert(e.message)}};
boot();
</script>
</body></html>
