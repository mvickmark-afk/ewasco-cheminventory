services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ewasco
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: ./server
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ewasco
      JWT_SECRET: change-this-to-a-random-secret-of-at-least-32-characters
      COOKIE_SECURE: "false"
      ORG_NAME: EWASCO
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-this-admin-password
    volumes:
      - uploads:/app/uploads
volumes:
  postgres_data:
  uploads:
